<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ServiMarket RD</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <nav>
            <h1><a href="index.html">🇩🇴 ServiMarket RD</a></h1>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="services.html">Servicios</a></li>
                <li><a href="jobs.html">Empleos</a></li>
                <li><a href="cart.html">Carrito <span id="cart-count"></span></a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="register.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="form-container">
                <h2 style="text-align: center; margin-bottom: 1rem;">Iniciar Sesión</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" name="password" required placeholder="******">
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Entrar</button>
                </form>
                <p style="text-align: center; margin-top: 1rem;">
                    ¿No tienes cuenta? <a href="register.html"
                        style="color: var(--primary); font-weight: bold;">Regístrate aquí</a>
                </p>
            </div>
        </div>
    </main>
    <footer style="text-align: center; padding: 2rem; background: var(--dark); color: #fff; margin-top: 2rem;">
        <p>&copy; 2025 ServiMarket RD. Todos los derechos reservados.</p>
    </footer>

    <!-- Toast Container -->
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <script>
        // --- LÓGICA DE AUTENTICACIÓN LOCAL ---
        const LocalAuth = {
            getUsers: () => {
                try { return JSON.parse(localStorage.getItem('users')) || []; } catch (e) { return []; }
            },
            login: (email, password) => {
                const users = LocalAuth.getUsers();
                const user = users.find(u => u.email === email && u.password === password);
                if (user) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    return user;
                }
                return null;
            }
        };

        // UI Helper for Toast
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = { success: '#10b981', error: '#ef4444' };
            toast.style.cssText = `background: ${colors[type]}; color: white; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; animation: slideIn 0.3s;`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Form Handler
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = e.target.email.value;
            const password = e.target.password.value;

            const user = LocalAuth.login(email, password);

            if (user) {
                showToast(`¡Bienvenido ${user.name}!`, 'success');

                // Redirect Logic based on Role
                setTimeout(() => {
                    if (user.role === 'ceo') {
                        window.location.href = 'admin.html';
                    } else if (user.role === 'vendedor') {
                        window.location.href = 'dashboard.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 1000);
            } else {
                showToast('Email o contraseña incorrectos', 'error');
            }
        });

        // Dark Mode Init
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    </script>

    <style>
        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }
    </style>
</body>

</html>
