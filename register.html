        <!DOCTYPE html>
        <html lang="es">

        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Registrarse - Marketplace RD</title>
            <link rel="stylesheet" href="assets/css/style.css">
        </head>

        <body>
            <header>
                <nav>
                    <h1><a href="index.html">🇩🇴 Marketplace RD</a></h1>
                    <ul>
                        <li><a href="index.html">Inicio</a></li>
                        <li><a href="cart.html">Carrito <span id="cart-count"></span></a></li>
                        <li><a href="login.html">Iniciar Sesión</a></li>
                        <li><a href="register.html">Registrarse</a></li>
                    </ul>
                </nav>
            </header>
            <main>

                <div class="form-container">
                    <h2 style="text-align: center; margin-bottom: 1rem;">Crear Cuenta</h2>
                    <form id="register-form">
                        <div class="form-group">
                            <label>Nombre Completo</label>
                            <input type="text" name="name" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label>Contraseña</label>
                            <input type="password" name="password" required>
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" name="phone" required>
                        </div>
                        <div class="form-group">
                            <label>Ubicación</label>
                            <input type="text" name="location" required placeholder="Ej. Santo Domingo">
                        </div>
                        <div class="form-group">
                            <label>Tipo de Usuario</label>
                            <select name="role">
                                <option value="cliente">Cliente (Comprador)</option>
                                <option value="vendedor">Vendedor (Productos)</option>
                                <option value="proveedor">Proveedor (Servicios)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Descripción (Opcional)</label>
                            <textarea name="description" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn">Registrarse</button>
                    </form>
                    <p style="text-align: center; margin-top: 1rem;">
                        ¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a>
                    </p>
                </div>

            </main>
            <footer style="text-align: center; padding: 2rem; background: #333; color: #fff; margin-top: 2rem;">
                <p>&copy; 2025 Marketplace Dominicano. Todos los derechos reservados.</p>
            </footer>    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>

            <script src="assets/js/app.js"></script>
            <script>
                document.getElementById('register-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const userData = Object.fromEntries(formData.entries());

                    try {
                        auth.register(userData);
                        ui.toast('Registro exitoso. ¡Inicia sesión!');
                        setTimeout(() => window.location.href = 'login.html', 1500);
                    } catch (error) {
                        ui.toast(error.message, 'error');
                    }
                });
            </script>
        </body>

        </html>
