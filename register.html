<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - ServiMarket RD</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <nav>
            <h1><a href="index.html">🇩🇴 ServiMarket RD</a></h1>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="services.html">Servicios</a></li>
                <li><a href="jobs.html">Empleos</a></li>
                <li><a href="cart.html">Carrito <span id="cart-count"></span></a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="register.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="form-container">
                <h2 style="text-align: center; margin-bottom: 1rem;">Crear Cuenta</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" name="name" required placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" name="password" required placeholder="******">
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" name="phone" required placeholder="809-555-5555">
                    </div>
                    <div class="form-group">
                        <label>Ubicación</label>
                        <input type="text" name="location" required placeholder="Ej. Santo Domingo">
                    </div>
                    <div class="form-group">
                        <label>Tipo de Usuario</label>
                        <select name="role" required
                            style="width: 100%; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 0.3rem;">
                            <option value="comprador">Comprador (Cliente)</option>
                            <option value="vendedor">Vendedor (Productos)</option>
                            <option value="ceo">CEO (Administrador)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Registrarse</button>
                </form>
                <p style="text-align: center; margin-top: 1rem;">
                    ¿Ya tienes cuenta? <a href="login.html" style="color: var(--primary); font-weight: bold;">Inicia
                        Sesión</a>
                </p>
            </div>
        </div>
    </main>
    <footer style="text-align: center; padding: 2rem; background: var(--dark); color: #fff; margin-top: 2rem;">
        <p>&copy; 2025 ServiMarket RD. Todos los derechos reservados.</p>
    </footer>

    <!-- Toast Container -->
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <script>
        // --- LÓGICA DE AUTENTICACIÓN LOCAL ---
        const LocalAuth = {
            getUsers: () => {
                try { return JSON.parse(localStorage.getItem('users')) || []; } catch (e) { return []; }
            },
            register: (userData) => {
                const users = LocalAuth.getUsers();
                if (users.find(u => u.email === userData.email)) {
                    throw new Error('El email ya está registrado');
                }
                users.push(userData);
                localStorage.setItem('users', JSON.stringify(users));
                return userData;
            }
        };

        // UI Helper for Toast
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = { success: '#10b981', error: '#ef4444' };
            toast.style.cssText = `background: ${colors[type]}; color: white; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; animation: slideIn 0.3s;`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Form Handler
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const userData = Object.fromEntries(formData.entries());

            try {
                LocalAuth.register(userData);
                showToast('¡Registro exitoso! Redirigiendo...', 'success');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } catch (error) {
                showToast(error.message, 'error');
            }
        });

        // Dark Mode Init
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    </script>

    <style>
        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }
    </style>
</body>

</html>
