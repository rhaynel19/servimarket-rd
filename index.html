<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiMarket RD - Marketplace Dominicano</title>
    <meta name="description" content="Marketplace dominicano de productos, servicios y empleos">
    <link rel="stylesheet" href="assets/css/style.css">
    <h1>🇩🇴 Bienvenido a ServiMarket RD</h1>
    <p>Tu marketplace completo: Productos, Servicios y Empleos en un solo lugar</p>
    </div>

    <!-- Quick Access Buttons -->
    <div
        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 3rem;">
        <a href="#productos" class="product-card"
            style="padding: 2rem; text-align: center; cursor: pointer; text-decoration: none;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🛍️</div>
            <h3 style="color: #1A73E8; margin-bottom: 0.5rem;">Productos</h3>
            <p style="color: #64748b; font-size: 0.9rem;">Compra artículos locales</p>
        </a>
        <a href="services.html" class="product-card"
            style="padding: 2rem; text-align: center; cursor: pointer; text-decoration: none;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🔧</div>
            <h3 style="color: #1A73E8; margin-bottom: 0.5rem;">Servicios</h3>
            <p style="color: #64748b; font-size: 0.9rem;">Encuentra profesionales</p>
        </a>
        <a href="jobs.html" class="product-card"
            style="padding: 2rem; text-align: center; cursor: pointer; text-decoration: none;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">💼</div>
            <h3 style="color: #1A73E8; margin-bottom: 0.5rem;">Empleos</h3>
            <p style="color: #64748b; font-size: 0.9rem;">Trabaja o contrata</p>
        </a>
        <a href="dashboard.html" class="product-card"
            style="padding: 2rem; text-align: center; cursor: pointer; text-decoration: none;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">📊</div>
            <h3 style="color: #1A73E8; margin-bottom: 0.5rem;">Mi Negocio</h3>
            <p style="color: #64748b; font-size: 0.9rem;">Gestiona tu tienda</p>
        </a>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Buscar productos..." onkeyup="filterProducts()">
        <select id="cat-select" onchange="filterProducts()">
            <option value="">Todas las categorías</option>
            <option value="Postres">Postres</option>
            }

            to {
            transform: translateX(0);
            opacity: 1;
            }
            }

            @keyframes slideOut {
            from {
            transform: translateX(0);
            opacity: 1;
            }

            to {
            transform: translateX(400px);
            opacity: 0;
            }
            }
            </style>
            </body>

</html>
