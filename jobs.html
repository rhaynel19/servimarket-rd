<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleos - ServiMarket RD</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <nav>
            <h1><a href="index.html">🇩🇴 ServiMarket RD</a></h1>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="services.html">Servicios</a></li>
                <li><a href="jobs.html">Empleos</a></li>
                <li><a href="cart.html">Carrito <span id="cart-count"></span></a></li>
            </ul>
        </nav>
    </header>
    <main>

        <div class="container">
            <div class="hero" style="background: linear-gradient(135deg, #1A73E8, #0d47a1);">
                <h1>🔧 Empleos y Chiripas</h1>
                <p>Encuentra trabajos por hora o publica tu oferta</p>
                <div style="margin-top: 2rem;">
                    <button class="btn" onclick="showPostJobModal()"
                        style="background: #D4A017; color: #0f172a; font-weight: bold;">+ Publicar Empleo</button>
                </div>
            </div>

            <!-- Filters -->
            <div class="search-bar">
                <input type="text" id="job-search" placeholder="Buscar empleos..." onkeyup="filterJobs()">
                <select id="job-type" onchange="filterJobs()">
                    <option value="">Todos los tipos</option>
                    <option value="Por Hora">Por Hora</option>
                    <option value="Por Servicio">Por Servicio</option>
                    <option value="Tiempo Completo">Tiempo Completo</option>
                </select>
                <select id="job-municipio" onchange="filterJobs()">
                    <option value="">Todos los municipios</option>
                    <option value="Santo Domingo">Santo Domingo</option>
                    <option value="Santiago">Santiago</option>
                    <option value="La Romana">La Romana</option>
                    <option value="Puerto Plata">Puerto Plata</option>
                </select>
            </div>

            <h2 style="margin-bottom: 1.5rem; color: #0f172a;">Empleos Disponibles</h2>
            <div id="jobs-grid" class="product-grid">
                <!-- Jobs loaded via JS -->
            </div>
        </div>

        <!-- Post Job Modal -->
        <div id="post-job-modal"
            style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center;">
            <div class="form-container"
                style="max-width: 500px; margin: 0; background: white; padding: 2rem; border-radius: 1rem; width: 90%;">
                <h2 style="margin-bottom: 1.5rem; color: #0f172a;">Publicar Empleo</h2>
                <form id="post-job-form">
                    <div class="form-group">
                        <label>Título del Empleo</label>
                        <input type="text" name="title" required placeholder="Ej: Ayudante de construcción">
                    </div>
                    <div class="form-group">
                        <label>Tipo de Trabajo</label>
                        <select name="type" required>
                            <option value="Por Hora">Por Hora</option>
                            <option value="Por Servicio">Por Servicio</option>
                            <option value="Tiempo Completo">Tiempo Completo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Pago (RD$)</label>
                        <input type="number" name="pay" required placeholder="Ej: 500">
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea name="description" required rows="3" placeholder="Detalles del trabajo..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Ubicación</label>
                        <select name="municipio" required>
                            <option value="Santo Domingo">Santo Domingo</option>
                            <option value="Santiago">Santiago</option>
                            <option value="La Romana">La Romana</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                        <button type="submit" class="btn" style="flex: 1;">Publicar</button>
                        <button type="button" class="btn" style="flex: 1; background: #94a3b8;"
                            onclick="closePostJobModal()">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <footer style="text-align: center; padding: 2rem; background: #0f172a; color: #fff; margin-top: 2rem;">
        <p>&copy; 2025 ServiMarket RD. Todos los derechos reservados.</p>
    </footer>

    <script>
        // --- LÓGICA STANDALONE PARA EMPLEOS ---

        // 1. Datos de Ejemplo
        let JOBS = [
            {
                id: 1,
                title: 'Ayudante de Construcción',
                type: 'Por Día',
                description: 'Se necesita ayudante para mezcla y carga de materiales. Pago diario.',
                pay: 1200,
                payPer: 'Día',
                employer: 'Constructora ABC',
                municipio: 'Santo Domingo',
                postedDate: '2025-12-05'
            },
            {
                id: 2,
                title: 'Vendedor de Tienda',
                type: 'Tiempo Completo',
                description: 'Atención al cliente y organización de mercancía. Experiencia previa deseable.',
                pay: 18000,
                payPer: 'Mes',
                employer: 'Tienda La Moda',
                municipio: 'Santiago',
                postedDate: '2025-12-04'
            },
            {
                id: 3,
                title: 'Jardinero Ocasional',
                type: 'Por Servicio',
                description: 'Poda de árboles y limpieza de patio grande.',
                pay: 2500,
                payPer: 'Servicio',
                employer: 'Residencia Privada',
                municipio: 'La Romana',
                postedDate: '2025-12-06'
            },
            {
                id: 4,
                title: 'Repartidor en Motor',
                type: 'Tiempo Completo',
                description: 'Delivery para restaurante. Debe tener motor propio y licencia al día.',
                pay: 15000,
                payPer: 'Mes',
                employer: 'Pizzería Italia',
                municipio: 'Santo Domingo',
                postedDate: '2025-12-03'
            }
        ];

        // 2. Utilidades UI
        const UI = {
            formatCurrency: (amount) => {
                return new Intl.NumberFormat('es-DO', { style: 'currency', currency: 'DOP' }).format(amount);
            },
            updateCartCounter: () => {
                try {
                    const items = JSON.parse(localStorage.getItem('cart')) || [];
                    const count = items.reduce((sum, item) => sum + item.quantity, 0);
                    const badge = document.getElementById('cart-count');
                    if (badge) badge.textContent = count > 0 ? `(${count})` : '';
                } catch (e) { }
            }
        };

        // 3. Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            renderJobs(JOBS);
            UI.updateCartCounter();
        });

        // 4. Funciones Principales
        function filterJobs() {
            const search = document.getElementById('job-search').value.toLowerCase();
            const type = document.getElementById('job-type').value;
            const municipio = document.getElementById('job-municipio').value;

            const filtered = JOBS.filter(j => {
                const matchSearch = j.title.toLowerCase().includes(search) || j.description.toLowerCase().includes(search);
                const matchType = !type || j.type === type;
                const matchMunicipio = !municipio || j.municipio === municipio;
                return matchSearch && matchType && matchMunicipio;
            });

            renderJobs(filtered);
        }

        function renderJobs(jobs) {
            const container = document.getElementById('jobs-grid');

            if (jobs.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No se encontraron empleos.</p>';
                return;
            }

            container.innerHTML = jobs.map(job => `
                <div class="product-card" style="padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem;">
                            <h3 style="color: #1A73E8; margin: 0; font-size: 1.25rem;">${job.title}</h3>
                            <span style="background: #D4A017; color: white; padding: 0.3rem 0.8rem; border-radius: 1rem; font-size: 0.85rem; font-weight: bold;">${job.type}</span>
                        </div>
                        <p style="color: #64748b; margin-bottom: 1rem;">${job.description}</p>
                        <div style="margin-bottom: 1rem;">
                            <p><strong>💰 Pago:</strong> ${UI.formatCurrency(job.pay)} / ${job.payPer}</p>
                            <p><strong>📍 Ubicación:</strong> ${job.municipio}</p>
                            <p><strong>👤 Empleador:</strong> ${job.employer}</p>
                            <p style="font-size: 0.85rem; color: #64748b; margin-top: 0.5rem;">Publicado: ${job.postedDate}</p>
                        </div>
                    </div>
                    <button class="btn" onclick="applyToJob('${job.title}')" style="width: 100%; background: #1A73E8; margin-top: 1rem;">
                        Aplicar Ahora
                    </button>
                </div>
            `).join('');
        }

        // Funciones Globales
        window.applyToJob = function (jobTitle) {
            alert(`¡Has aplicado para: ${jobTitle}!\n\nEl empleador revisará tu perfil.`);
        };

        window.showPostJobModal = function () {
            document.getElementById('post-job-modal').style.display = 'flex';
        };

        window.closePostJobModal = function () {
            document.getElementById('post-job-modal').style.display = 'none';
        };

        // Manejo del formulario de publicación
        document.getElementById('post-job-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const newJob = {
                id: JOBS.length + 1,
                title: formData.get('title'),
                type: formData.get('type'),
                description: formData.get('description'),
                pay: parseFloat(formData.get('pay')),
                payPer: 'Servicio', // Default simplificado
                employer: 'Tú (Usuario)',
                municipio: formData.get('municipio'),
                postedDate: new Date().toISOString().split('T')[0]
            };

            JOBS.unshift(newJob); // Agregar al inicio
            renderJobs(JOBS);
            closePostJobModal();
            alert('¡Empleo publicado exitosamente!');
        });
    </script>
</body>

</html>
