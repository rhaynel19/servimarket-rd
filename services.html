<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios - Marketplace RD</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <nav>
            <h1><a href="index.html">🇩🇴 ServiMarket RD</a></h1>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="services.html">Servicios</a></li>
                <li><a href="jobs.html">Empleos</a></li>
                <li><a href="cart.html">Carrito <span id="cart-count"></span></a></li>
            </ul>
        </nav>
    </header>
    <main>

        <div class="container">
            <div class="hero" style="background: linear-gradient(135deg, #059669, #064e3b);">
                <h1>Encuentra Profesionales</h1>
                <p>Plomeros, Electricistas, Belleza y más a tu disposición.</p>
            </div>

            <!-- Buscador -->
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="¿Qué servicio necesitas?" onkeyup="filterServices()">
                <select id="cat-select" onchange="filterServices()">
                    <option value="">Todas las categorías</option>
                    <option value="Plomería">Plomería</option>
                    <option value="Electricidad">Electricidad</option>
                    <option value="Belleza">Belleza</option>
                    <option value="Limpieza">Limpieza</option>
                    <option value="Técnico">Técnico</option>
                </select>
            </div>

            <div id="services-grid" class="product-grid">
                <!-- Services loaded via JS -->
            </div>
        </div>

    </main>

    <footer style="text-align: center; padding: 2rem; background: #0f172a; color: #fff; margin-top: 2rem;">
        <p>&copy; 2025 ServiMarket RD. Todos los derechos reservados.</p>
    </footer>

    <script>
        // --- LÓGICA STANDALONE PARA SERVICIOS ---

        // 1. Datos de Ejemplo (Hardcoded)
        const SERVICES = [
            {
                id: 1,
                name: 'Plomería Residencial Express',
                category: 'Plomería',
                description: 'Reparación de fugas, instalación de grifos y destape de tuberías. Servicio 24/7.',
                price: 1500,
                provider: 'Juan Pérez',
                location: 'Santo Domingo',
                rating: 4.8,
                image: 'assets/images/plomero.png'
            },
            {
                id: 2,
                name: 'Instalación de Inversores',
                category: 'Electricidad',
                description: 'Instalación y mantenimiento de inversores y baterías. Garantía de 6 meses.',
                price: 2500,
                provider: 'ElectroServicios RD',
                location: 'Santiago',
                rating: 4.9,
                image: 'assets/images/electricista.png'
            },
            {
                id: 3,
                name: 'Maquillaje Profesional a Domicilio',
                category: 'Belleza',
                description: 'Maquillaje para bodas, eventos y fiestas. Productos de alta gama.',
                price: 2000,
                provider: 'Laura Beauty',
                location: 'Santo Domingo',
                rating: 5.0,
                image: 'assets/images/maquillaje.png'
            },
            {
                id: 4,
                name: 'Limpieza Profunda de Hogar',
                category: 'Limpieza',
                description: 'Limpieza general, lavado de baños y cocina. Personal de confianza.',
                price: 1200,
                provider: 'CleanHome RD',
                location: 'La Romana',
                rating: 4.6,
                image: 'assets/images/limpieza.png'
            },
            {
                id: 5,
                name: 'Reparación de Aires Acondicionados',
                category: 'Técnico',
                description: 'Mantenimiento preventivo y correctivo de aires split y de ventana.',
                price: 1800,
                provider: 'FrioMax',
                location: 'Puerto Plata',
                rating: 4.7,
                image: 'assets/images/aire.png'
            }
        ];

        // 2. Utilidades UI
        const UI = {
            formatCurrency: (amount) => {
                return new Intl.NumberFormat('es-DO', { style: 'currency', currency: 'DOP' }).format(amount);
            },
            updateCartCounter: () => {
                try {
                    const items = JSON.parse(localStorage.getItem('cart')) || [];
                    const count = items.reduce((sum, item) => sum + item.quantity, 0);
                    const badge = document.getElementById('cart-count');
                    if (badge) badge.textContent = count > 0 ? `(${count})` : '';
                } catch (e) { }
            }
        };

        // 3. Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            renderServices(SERVICES);
            UI.updateCartCounter();
        });

        // 4. Funciones Principales
        function filterServices() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const cat = document.getElementById('cat-select').value;

            const filtered = SERVICES.filter(s => {
                const matchQuery = s.name.toLowerCase().includes(query) || s.description.toLowerCase().includes(query);
                const matchCat = cat === '' || s.category === cat;
                return matchQuery && matchCat;
            });

            renderServices(filtered);
        }

        function renderServices(services) {
            const container = document.getElementById('services-grid');

            if (services.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No se encontraron servicios.</p>';
                return;
            }

            container.innerHTML = services.map(s => `
                <div class="product-card" style="display: flex; flex-direction: column; justify-content: space-between;">
                    <img src="${s.image}" alt="${s.name}" onerror="this.src='https://placehold.co/300x200/059669/FFFFFF?text=${s.category}'" style="width: 100%; height: 200px; object-fit: cover; border-radius: 0.5rem 0.5rem 0 0;">
                    <div style="padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column;">
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem;">
                            <h3 style="color: #0f172a; font-size: 1.25rem; margin: 0;">${s.name}</h3>
                        </div>
                        <span style="background: #d1fae5; color: #065f46; padding: 0.2rem 0.6rem; border-radius: 1rem; font-size: 0.75rem; align-self: start; margin-bottom: 1rem;">${s.category}</span>
                        
                        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1rem; flex-grow: 1;">${s.description}</p>
                        
                        <div style="border-top: 1px solid #e2e8f0; padding-top: 1rem; margin-top: auto;">
                            <p style="font-size: 0.9rem; margin-bottom: 0.5rem;"><strong>👤 Proveedor:</strong> ${s.provider}</p>
                            <p style="font-size: 0.9rem; margin-bottom: 0.5rem;"><strong>📍 Ubicación:</strong> ${s.location}</p>
                            <p style="font-size: 0.9rem; margin-bottom: 1rem;"><strong>⭐ Calificación:</strong> ${s.rating}/5.0</p>
                            
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
                                <span class="product-price" style="font-size: 1.2rem;">${UI.formatCurrency(s.price)}</span>
                                <button class="btn" onclick="requestService('${s.name}')" style="background: #059669;">Solicitar</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Función global para el botón onclick
        window.requestService = function (serviceName) {
            alert(`Has solicitado el servicio: ${serviceName}\n\nEl proveedor se pondrá en contacto contigo pronto.`);
        };
    </script>
</body>

</html>
