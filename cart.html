<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Marketplace RD</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <nav>
            <h1><a href="index.html">🇩🇴 ServiMarket RD</a></h1>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="services.html">Servicios</a></li>
                <li><a href="jobs.html">Empleos</a></li>
                <li><a href="cart.html">Carrito <span id="cart-count"></span></a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="register.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>
    <main>

        <div class="container">
            <h2 style="margin-bottom: 2rem;">Tu Carrito</h2>
            <div id="cart-items"></div>
            <div style="text-align: right; margin-top: 2rem;">
                <h3 id="cart-total" style="font-size: 2rem; margin-bottom: 1rem;">Total: RD$ 0.00</h3>
                <a href="checkout.html" class="btn" id="checkout-btn">Proceder al Pago</a>
            </div>
        </div>

    </main>
    <footer style="text-align: center; padding: 2rem; background: #0f172a; color: #fff; margin-top: 2rem;">
        <p>&copy; 2025 ServiMarket RD. Todos los derechos reservados.</p>
    </footer>

    <script>
        // --- LÓGICA STANDALONE PARA CARRITO ---
        const LocalCart = {
            get: () => {
                try {
                    return JSON.parse(localStorage.getItem('cart')) || [];
                } catch (e) {
                    return [];
                }
            },
            remove: (id) => {
                let items = LocalCart.get();
                items = items.filter(i => i.id !== id);
                localStorage.setItem('cart', JSON.stringify(items));
                LocalCart.updateCounter();
                renderCart();
            },
            total: () => {
                const items = LocalCart.get();
                return items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            },
            updateCounter: () => {
                const items = LocalCart.get();
                const count = items.reduce((sum, item) => sum + item.quantity, 0);
                const badge = document.getElementById('cart-count');
                if (badge) {
                    badge.textContent = count > 0 ? `(${count})` : '';
                }
            }
        };

        const UI = {
            formatCurrency: (amount) => {
                return new Intl.NumberFormat('es-DO', { style: 'currency', currency: 'DOP' }).format(amount);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
            LocalCart.updateCounter();
        });

        function renderCart() {
            const items = LocalCart.get();
            const container = document.getElementById('cart-items');

            if (items.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 2rem;">Tu carrito está vacío.</p>';
                const checkoutBtn = document.getElementById('checkout-btn');
                if (checkoutBtn) checkoutBtn.style.display = 'none';
                document.getElementById('cart-total').textContent = 'Total: RD$ 0.00';
                return;
            }

            container.innerHTML = `
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 2px solid #e2e8f0; text-align: left;">
                            <th style="padding: 1rem;">Producto</th>
                            <th style="padding: 1rem;">Precio</th>
                            <th style="padding: 1rem;">Cant.</th>
                            <th style="padding: 1rem;">Total</th>
                            <th style="padding: 1rem;">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${items.map(item => `
                            <tr style="border-bottom: 1px solid #e2e8f0;">
                                <td style="padding: 1rem;">${item.name}</td>
                                <td style="padding: 1rem;">${UI.formatCurrency(item.price)}</td>
                                <td style="padding: 1rem;">${item.quantity}</td>
                                <td style="padding: 1rem;">${UI.formatCurrency(item.price * item.quantity)}</td>
                                <td style="padding: 1rem;">
                                    <button class="btn" style="background: #ef4444; padding: 0.5rem 1rem; font-size: 0.8rem;" onclick="removeFromCart('${item.id}')">Eliminar</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            document.getElementById('cart-total').textContent = `Total: ${UI.formatCurrency(LocalCart.total())}`;
            const checkoutBtn = document.getElementById('checkout-btn');
            if (checkoutBtn) checkoutBtn.style.display = 'inline-block';
        }

        // Función global para el botón onclick
        window.removeFromCart = function (id) {
            LocalCart.remove(id);
        };
    </script>
</body>

</html>
